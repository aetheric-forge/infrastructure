apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - ../../../platform/ingress-nginx/overlays/dev
  - ../../../platform/cert-manager/core
  - ../../../platform/storage/base
  - ../../../platform/step-ca/base
  - ../../../platform/external-dns/base
  - ../../../platform/external-dns/serviceaccounts
  - ../../../platform/external-dns/instances
  - ../../../platform/argocd/overlays/dev

configMapGenerator:
  - name: external-dns-config
    envs:
      - external-dns.env

generatorOptions:
  disableNameSuffixHash: true

vars:
  - name: INTERNAL_DOMAIN
    objref:
      kind: ConfigMap
      name: external-dns-config
      apiVersion: v1
    fieldref:
      fieldpath: data.INTERNAL_DOMAIN

  - name: EXTERNAL_DOMAIN
    objref:
      kind: ConfigMap
      name: external-dns-config
      apiVersion: v1
    fieldref:
      fieldpath: data.EXTERNAL_DOMAIN

  - name: INTERNAL_ZONE_ID
    objref:
      kind: ConfigMap
      name: external-dns-config
      apiVersion: v1
    fieldref:
      fieldpath: data.INTERNAL_ZONE_ID

  - name: EXTERNAL_ZONE_ID
    objref:
      kind: ConfigMap
      name: external-dns-config
      apiVersion: v1
    fieldref:
      fieldpath: data.EXTERNAL_ZONE_ID

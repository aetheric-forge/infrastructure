apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress-nginx-namespace.yaml
  - ../../../../../platform/core/step-ca/base
  - ../../../../../platform/core/cert-manager/base
  - ../../../../../platform/core/velero/base

helmCharts:
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.13.3
    releaseName: ingress-nginx-private
    namespace: ingress-nginx
    valuesInline:
      controller:
        admissionWebhooks:
          enabled: true
          patch:
            enabled: true
        electionID: ingress-nginx-private-leader
        ingressClass: nginx-private
        ingressClassResource:
          enabled: true
          name: nginx-private
          controllerValue: k8s.io/ingress-nginx-private
          default: true
        watchIngressWithoutClass: false
        service:
          type: LoadBalancer
          annotations:
            kubernetes.civo.com/firewall-id: CIVO_PRIVATE_LB_FIREWALL_ID_PLACEHOLDER
  - name: ingress-nginx
    repo: https://kubernetes.github.io/ingress-nginx
    version: 4.13.3
    releaseName: ingress-nginx-public
    namespace: ingress-nginx
    valuesInline:
      controller:
        admissionWebhooks:
          enabled: true
          patch:
            enabled: true
        electionID: ingress-nginx-public-leader
        ingressClass: nginx-public
        ingressClassResource:
          enabled: true
          name: nginx-public
          controllerValue: k8s.io/ingress-nginx-public
          default: false
        watchIngressWithoutClass: false
        service:
          type: LoadBalancer
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.21.1
    releaseName: external-dns-internal
    namespace: external-dns
    valuesInline:
      provider:
        name: rfc2136
      sources:
        - service
        - ingress
      domainFilters:
        - INTERNAL_DOMAIN_PLACEHOLDER
      registry: txt
      txtOwnerId: internal
      policy: sync
      extraArgs:
        rfc2136-host: INT_DNS_HOST_PLACEHOLDER
        rfc2136-port: "5335"
        rfc2136-zone: INTERNAL_DOMAIN_PLACEHOLDER
        rfc2136-tsig-secret-alg: hmac-sha256
        rfc2136-tsig-keyname: external-dns-ENVIRONMENT_PLACEHOLDER-key
        rfc2136-tsig-axfr: true
      env:
        - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
          valueFrom:
            secretKeyRef:
              name: external-dns-internal-tsig
              key: tsig-secret
      serviceAccount:
        create: true
        name: external-dns-internal
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns/
    version: 1.21.1
    releaseName: external-dns-external
    namespace: external-dns
    valuesInline:
      provider:
        name: cloudflare
      env:
        - name: CF_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api-token
              key: apiToken
      sources:
        - service
        - ingress
      domainFilters:
        - EXTERNAL_DOMAIN_PLACEHOLDER
      registry: txt
      txtOwnerId: external
      policy: sync
      extraArgs:
        exclude-domains: INTERNAL_DOMAIN_PLACEHOLDER
      serviceAccount:
        create: true
        name: external-dns-external

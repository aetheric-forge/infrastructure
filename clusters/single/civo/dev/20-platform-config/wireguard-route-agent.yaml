apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wireguard-route-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: wireguard-route-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wireguard-route-agent
    spec:
      hostNetwork: true
      containers:
        - name: route-agent
          image: alpine:3.22
          command:
            - /bin/sh
            - -ec
            - |
              ip route replace WIREGUARD_LOCAL_CIDR_PLACEHOLDER via WIREGUARD_PRIVATE_IP_PLACEHOLDER
              trap 'ip route del WIREGUARD_LOCAL_CIDR_PLACEHOLDER via WIREGUARD_PRIVATE_IP_PLACEHOLDER 2>/dev/null || true' EXIT
              while true; do sleep 3600; done
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
      tolerations:
        - operator: Exists

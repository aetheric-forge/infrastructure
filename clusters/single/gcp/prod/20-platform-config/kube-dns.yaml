# GKE internal zones use the existing BIND server over the WireGuard route.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-dns
  namespace: kube-system
  labels:
    addonmanager.kubernetes.io/mode: EnsureExists
data:
  stubDomains: |-
    {"INTERNAL_DOMAIN_PLACEHOLDER": ["INT_DNS_HOST_PLACEHOLDER:5335"], "int.aethericforge.ca": ["INT_DNS_HOST_PLACEHOLDER:5335"]}

networks:
  dev-network:
    driver: bridge
    name: dev-network
services:
  aethericforge-web:
    build:
      context: ../../aetheric-web
      dockerfile: docker/Dockerfile
    container_name: aethericforge-web
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
      minio-bootstrap:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Keycloak__AdminClientId: forge-campus-provisioner
      Keycloak__AdminClientSecret: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:?set KEYCLOAK_PROVISIONER_CLIENT_SECRET
        in .env}
      Keycloak__Authority: https://sso.aethericforge.ca
      Keycloak__ClientId: forge-campus
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET
        in .env}
      Keycloak__Realm: aethericforge.ca
      MongoDb__AuthenticationDatabase: forge-campus
      MongoDb__AuthenticationMechanism: SCRAM-SHA-256
      MongoDb__DatabaseName: forge-campus
      MongoDb__DirectConnection: "true"
      MongoDb__Host: dev-mongodb
      MongoDb__Password: ${MONGO_FORGE_CAMPUS_PASSWORD:?set MONGO_FORGE_CAMPUS_PASSWORD
        in .env}
      MongoDb__Port: 27017
      MongoDb__Username: forge-campus
      RabbitMq__Host: dev-rabbitmq
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RabbitMq__Port: 5672
      RabbitMq__Ssl: "false"
      RabbitMq__Username: forge-campus
      RabbitMq__VirtualHost: forge-campus
      Redis__Database: 0
      Redis__Host: dev-redis
      Redis__Password: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      Redis__Port: 6379
      Redis__Ssl: "false"
      S3__AccessKey: forge-campus
      S3__AuthenticationRegion: us-east-1
      S3__ForcePathStyle: "true"
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3__ServiceUrl: http://dev-minio:9000
    extra_hosts:
    - sso.aethericforge.ca:host-gateway
    image: aethericforge-web:dev
    networks:
    - dev-network
    ports:
    - 127.0.0.1:5100:8080
    restart: unless-stopped
    volumes:
    - dev-aethericforge-data-protection:/root/.aspnet/DataProtection-Keys
  blackcircuit-web:
    build:
      context: ../../blackcircuit-web
      dockerfile: docker/Dockerfile
    container_name: blackcircuit-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    image: blackcircuit-web:dev
    networks:
    - dev-network
    ports:
    - 127.0.0.1:5101:8080
    restart: unless-stopped
  keycloak:
    command:
    - start-dev
    container_name: dev-keycloak
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD
        in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: platform-admin
      KC_DB: postgres
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_DB_URL_DATABASE: keycloak
      KC_DB_URL_HOST: dev-postgresql
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: https://sso.aethericforge.ca
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      interval: 10s
      retries: 18
      start_period: 30s
      test:
      - CMD-SHELL
      - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf ''GET /health/ready HTTP/1.1\r\nhost:
        localhost\r\nConnection: close\r\n\r\n'' >&3; grep -q ''200 OK'' <&3'
      timeout: 5s
    image: quay.io/keycloak/keycloak:26.1.0
    networks:
    - dev-network
    ports:
    - 127.0.0.1:8080:8080
    restart: unless-stopped
    volumes:
    - dev-keycloak:/opt/keycloak/data
  keycloak-bootstrap:
    container_name: dev-keycloak-bootstrap
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint:
    - /bin/bash
    - /bootstrap/bootstrap.sh
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD
        in .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET
        in .env}
      KEYCLOAK_PROVISIONER_CLIENT_SECRET: ${KEYCLOAK_PROVISIONER_CLIENT_SECRET:?set
        KEYCLOAK_PROVISIONER_CLIENT_SECRET in .env}
    image: quay.io/keycloak/keycloak:26.1.0
    networks:
    - dev-network
    restart: "no"
    volumes:
    - ./keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
  minio:
    command:
    - server
    - /data
    - --console-address
    - :9001
    container_name: dev-minio
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_ROOT_USER: forge-campus
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 10s
      test:
      - CMD
      - mc
      - ready
      - local
      timeout: 5s
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    networks:
    - dev-network
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    restart: unless-stopped
    volumes:
    - dev-minio:/data
  minio-bootstrap:
    command:
    - |
      mc alias set dev http://dev-minio:9000 forge-campus "$${MINIO_ROOT_PASSWORD}"
      mc mb --ignore-existing dev/forge-campus-archive
    container_name: dev-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    - -ec
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    networks:
    - dev-network
    restart: "no"
  mongodb:
    container_name: dev-mongodb
    environment:
      MONGO_FORGE_CAMPUS_PASSWORD: ${MONGO_FORGE_CAMPUS_PASSWORD:?set MONGO_FORGE_CAMPUS_PASSWORD
        in .env}
      MONGO_FORGE_CAMPUS_USERNAME: forge-campus
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?set MONGO_ADMIN_PASSWORD
        in .env}
      MONGO_INITDB_ROOT_USERNAME: platform-admin
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 15s
      test:
      - CMD-SHELL
      - mongosh --quiet --username platform-admin --password "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep
        1
      timeout: 5s
    image: mongo:8.0
    networks:
    - dev-network
    ports:
    - 127.0.0.1:27017:27017
    restart: unless-stopped
    volumes:
    - dev-mongodb:/data/db
    - dev-mongodb-config:/data/configdb
    - ./mongodb/init:/docker-entrypoint-initdb.d:ro
  postgresql:
    container_name: dev-postgresql
    environment:
      FORGE_CAMPUS_POSTGRES_PASSWORD: ${FORGE_CAMPUS_POSTGRES_PASSWORD:?set FORGE_CAMPUS_POSTGRES_PASSWORD
        in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in
        .env}
      POSTGRES_USER: platform-admin
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 10s
      test:
      - CMD-SHELL
      - pg_isready -U platform-admin -d postgres
      timeout: 5s
    image: postgres:17.5
    networks:
    - dev-network
    ports:
    - 127.0.0.1:5432:5432
    restart: unless-stopped
    volumes:
    - dev-postgresql:/var/lib/postgresql/data
    - ./postgresql/init:/docker-entrypoint-initdb.d:ro
  rabbitmq:
    container_name: dev-rabbitmq
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_USER: forge-campus
      RABBITMQ_DEFAULT_VHOST: forge-campus
    healthcheck:
      interval: 10s
      retries: 12
      start_period: 20s
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      timeout: 5s
    image: rabbitmq:4.1-management
    networks:
    - dev-network
    ports:
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672
    restart: unless-stopped
    volumes:
    - dev-rabbitmq:/var/lib/rabbitmq
  redis:
    command:
    - redis-server
    - --appendonly
    - "yes"
    - --requirepass
    - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    container_name: dev-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 5s
      test:
      - CMD-SHELL
      - redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG
      timeout: 5s
    image: redis:8.2-alpine
    networks:
    - dev-network
    ports:
    - 127.0.0.1:6379:6379
    restart: unless-stopped
    volumes:
    - dev-redis:/data
version: "2.4"
volumes:
  dev-aethericforge-data-protection:
    name: dev-aethericforge-data-protection
  dev-keycloak:
    name: dev-keycloak
  dev-minio:
    name: dev-minio
  dev-mongodb:
    name: dev-mongodb
  dev-mongodb-config:
    name: dev-mongodb-config
  dev-postgresql:
    name: dev-postgresql
  dev-rabbitmq:
    name: dev-rabbitmq
  dev-redis:
    name: dev-redis

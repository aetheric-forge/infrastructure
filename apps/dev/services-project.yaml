apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: Aetheric Forge Platform Services

  sourceRepos:
    - 'git@github.com:aetheric-forge/infrastructure.git'

  sourceNamespaces:
    - 'argocd'
    - 'forge-db'
    - 'minio'
    - 'keycloak-system'
    - 'rabbitmq'
    - 'forge-mongo'

  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: forge-db
      server: https://kubernetes.default.svc
    - namespace: minio
      server: https://kubernetes.default.svc
    - namespace: keycloak-system
      server: https://kubernetes.default.svc
    - namespace: rabbitmq
      server: https://kubernetes.default.svc
    - namespace: forge-mongo
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'

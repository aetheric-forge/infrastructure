apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-cnpg-cluster
  namespace: argocd
spec:
  project: services
  source:
    repoURL: git@github.com:aetheric-forge/infrastructure.git
    targetRevision: v0.8
    path: platform/services/forge-cnpg-cluster/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-dev
  namespace: argocd
spec:
  project: services
  source:
    repoURL: git@github.com:aetheric-forge/infrastructure.git
    targetRevision: v0.8
    path: platform/services/keycloak/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---

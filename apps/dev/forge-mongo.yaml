apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-mongo-dev
  namespace: argocd
spec:
  project: services
  source:
    repoURL: git@github.com:aetheric-forge/infrastructure.git
    targetRevision: v0.9
    path: platform/services/forge-mongo/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: forge-mongo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true


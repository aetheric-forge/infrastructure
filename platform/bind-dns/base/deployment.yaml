apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind-dns
  namespace: bind-dns
spec:
  selector:
    matchLabels:
      app: bind-dns
  template:
    metadata:
      labels:
        app: bind-dns
    spec:
      containers:
        - name: bind
          image: internetsystemsconsortium/bind9:9.18
          command:
            - named
            - -g
            - -c
            - /config/named.conf
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: bind-cache
              mountPath: /var/cache/bind
            - name: config
              mountPath: /config
            - name: tsig
              mountPath: /etc/bind
            - name: zones
              mountPath: /zones
      securityContext:
        fsGroup: 1000
      volumes:
        - name: bind-cache
          emptyDir: {}
        - name: config
          configMap:
            name: bind-config
        - name: zones
          persistentVolumeClaim:
            claimName: bind-zones
        - name: bootstrap
          configMap:
            name: bind-zone-bootstrap
        - name: tsig
          secret:
            secretName: bind-tsig
            defaultMode: 0444
      initContainers:
        - name: init-zone
          image: busybox
          command:
            - sh
            - -c
            - |
              if [ ! -f /zones/db.int.aethericforge.ca ]; then
                cp /bootstrap/db.int.aethericforge.ca /zones/db.int.aethericforge.ca
              fi
          volumeMounts:
          - name: zones
            mountPath: /zones
          - name: bootstrap
            mountPath: /bootstrap

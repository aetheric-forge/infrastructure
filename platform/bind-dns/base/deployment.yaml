apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind-dns
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bind-dns
  template:
    metadata:
      labels:
        app: bind-dns
    spec:
      containers:
        - name: bind
          image: internetsystemsconsortium/bind9:9.18
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/bind/named.conf
              subPath: named.conf
            - name: tsig
              mountPath: /etc/bind/tsig.key
              subPath: tsig.key
            - name: zones
              mountPath: /zones
      volumes:
        - name: config
          configMap:
            name: bind-config
        - name: tsig
          secret:
            secretName: bind-tsig
        - name: zones
          persistentVolumeClaim:
            claimName: bind-zones
    initContainers:
      - name: init-zone
        image: busybox
        command:
          - sh
          - -c
          - |
            if [ ! -f /zones/db.int.aethericforge.ca ]; then
              cp /bootstrap/db.int.aethericforge.ca /zones/db.int.aethericforge.ca
            fi
        volumeMounts:
          - name: zones
            mountPath: /zones
          - name: bootstrap
            mountPath: /bootstrap

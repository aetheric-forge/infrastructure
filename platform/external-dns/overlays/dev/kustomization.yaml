enabled: false
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../internal/base

patches:
  - target:
      version: v1
      kind: Deployment
      name: external-dns-internal
      namespace: external-dns-internal
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: wg-dev.int.blackcircuit.ca

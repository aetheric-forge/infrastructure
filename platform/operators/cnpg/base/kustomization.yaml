apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: "0.28.2"
    releaseName: cnpg
    namespace: cnpg-system
    includeCRDs: true

  - name: plugin-barman-cloud
    repo: https://cloudnative-pg.github.io/charts
    version: "0.6.0"
    releaseName: plugin-barman-cloud
    namespace: cnpg-system
    includeCRDs: true

apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero

spec:
  default: true
  provider: aws

  objectStorage:
    bucket: velero
    caCert: 

  credential:
    name: cloud-credentials
    key: cloud

  config:
    region: minio
    s3ForcePathStyle: "true"
    s3Url: https://s3-dev.int.aethericforge.ca


# INTERNAL
provider:
  name: rfc2136

sources:
  - service
  - ingress

domainFilters:
  - int.blackcircuit.ca

registry: txt
txtOwnerId: internal
policy: sync

extraArgs:
  - --rfc2136-host=192.168.1.1
  - --rfc2136-port=5335
  - --rfc2136-zone=int.blackcircuit.ca
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-tsig-keyname=external-dns-blackcircuit-ca-prod
  - --rfc2136-tsig-axfr

env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: external-dns-internal-tsig
        key: tsig-secret

serviceAccount:
  create: true
  name: external-dns-internal

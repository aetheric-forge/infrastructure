apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-cluster
  namespace: aetheric-forge
spec:
  instances: 1

  storage:
    size: 20Gi

  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: forge-cluster-rw-lb
              annotations:
                metallb.io/address-pool: private-pool
            spec:
              type: LoadBalancer

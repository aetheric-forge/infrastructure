apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: step-ca-int-acme
    external-dns.alpha.kubernetes.io/hostname: sso.int.aethericforge.ca
spec:
  ingressClassName: nginx-private

  tls:
    - hosts:
        - sso.int.aethericforge.ca
      secretName: keycloak-tls

  rules:
    - host: sso.int.aethericforge.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  name: https

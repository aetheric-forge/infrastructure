# Downloads the newest archive and replays it, oplog included, into a throwaway
# mongod inside the pod, then prints per-collection document counts. Reads from
# object storage only: it needs no MongoDB credentials and cannot touch the real
# database.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-restore-drill
  namespace: forge-mongo
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: scripts
          configMap:
            name: mongo-restore-drill-scripts
            defaultMode: 0555
        - name: dump
          emptyDir:
            sizeLimit: 2Gi
        - name: scratch
          emptyDir:
            sizeLimit: 4Gi
        - name: fetch-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: restore-tmp
          emptyDir:
            sizeLimit: 64Mi
      initContainers:
        - name: fetch
          image: rclone/rclone:1.71.1
          command: ["/bin/sh", "/scripts/fetch.sh"]
          envFrom:
            - configMapRef:
                name: mongo-backup-config
          env:
            - name: HOME
              value: /tmp
            - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mongo-backup-s3
                  key: access-key-id
            - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mongo-backup-s3
                  key: secret-access-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: dump
              mountPath: /dump
            - name: fetch-tmp
              mountPath: /tmp
      containers:
        - name: restore
          image: quay.io/mongodb/mongodb-community-server:8.0.13-ubi8
          command: ["/bin/sh", "/scripts/restore.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: dump
              mountPath: /dump
              readOnly: true
            - name: scratch
              mountPath: /scratch
            - name: restore-tmp
              mountPath: /tmp

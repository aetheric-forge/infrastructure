# Nightly logical backup of every database: mongodump (with the oplog, so the
# archive is one consistent point in time) uploaded to object storage, with
# copies older than RETENTION_DAYS removed after a verified upload.
#
# Where the archives go is set here, not in the scripts: RCLONE_CONFIG_STORE_*
# describe any S3-compatible service (set PROVIDER to match, e.g. AWS or Other).
# Credentials come from the mongo-backup-s3 Secret. Restore procedure:
# docs/operations/mongodb-backup.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-backup-config
  namespace: forge-mongo
data:
  MONGO_HOST: forge-mongo/forge-mongo-0.forge-mongo-svc.forge-mongo.svc.cluster.local:27017
  MONGO_USER: mongo-backup
  S3_BUCKET: mongo-backup
  RETENTION_DAYS: "14"
  RCLONE_CONFIG_STORE_TYPE: s3
  RCLONE_CONFIG_STORE_PROVIDER: Other
  RCLONE_CONFIG_STORE_ENDPOINT: http://seaweedfs-all-in-one.seaweedfs.svc.cluster.local:8333
  RCLONE_CONFIG_STORE_REGION: us-east-1
  RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: "true"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: forge-mongo
spec:
  # 02:45 UTC: after the forge-db base backup (02:30), before Velero (03:00).
  schedule: "45 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          # One uid for both containers: the dump is private to its owner.
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: scripts
              configMap:
                name: mongo-backup-scripts
                defaultMode: 0555
            - name: dump
              emptyDir:
                sizeLimit: 2Gi
            # Separate scratch space so the database password written by the
            # dump step is never visible to the upload step.
            - name: dump-tmp
              emptyDir:
                sizeLimit: 16Mi
            - name: upload-tmp
              emptyDir:
                sizeLimit: 64Mi
          initContainers:
            - name: dump
              image: quay.io/mongodb/mongodb-community-server:8.0.13-ubi8
              command: ["/bin/sh", "/scripts/dump.sh"]
              envFrom:
                - configMapRef:
                    name: mongo-backup-config
              env:
                - name: MONGO_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongo-backup-mongo-password
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: dump
                  mountPath: /dump
                - name: dump-tmp
                  mountPath: /tmp
          containers:
            - name: upload
              image: rclone/rclone:1.71.1
              command: ["/bin/sh", "/scripts/upload.sh"]
              envFrom:
                - configMapRef:
                    name: mongo-backup-config
              env:
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG_STORE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: mongo-backup-s3
                      key: access-key-id
                - name: RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mongo-backup-s3
                      key: secret-access-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: dump
                  mountPath: /dump
                  readOnly: true
                - name: upload-tmp
                  mountPath: /tmp

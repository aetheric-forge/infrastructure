apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: forge-mongo

resources:
  - ../../secrets/prod
  - mongodb.yaml
  - service.yaml
  - mongo-backup.yaml

# The same files run in the CronJob and in local tests of the backup.
configMapGenerator:
  - name: mongo-backup-scripts
    files:
      - scripts/dump.sh
      - scripts/upload.sh

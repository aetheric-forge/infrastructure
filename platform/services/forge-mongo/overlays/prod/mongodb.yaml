apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: forge-mongo
  namespace: forge-mongo
spec:
  members: 1
  type: ReplicaSet
  version: "8.0.13"

  security:
    authentication:
      modes:
        - SCRAM

  users:
    - name: forge-mongo-admin
      db: admin
      passwordSecretRef:
        name: forge-mongo-admin
        key: password
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: forge-mongo-admin-scram

    - name: blackcircuit-admin
      db: blackcircuit
      passwordSecretRef:
        name: blackcircuit-admin-mongo-password
        key: password
      roles:
        - name: readWrite
          db: blackcircuit
      scramCredentialsSecretName: blackcircuit-admin-scram
    - name: blackcircuit-web
      db: blackcircuit
      passwordSecretRef:
        name: blackcircuit-web-mongo-password
        key: password
      roles:
        - name: read
          db: blackcircuit
      scramCredentialsSecretName: blackcircuit-web-scram
    # Aetheric application accounts. Added to the live resource by hand, now
    # recorded here so applying this overlay doesn't delete them. Their password
    # and SCRAM secrets are created in-cluster and are not yet in git.
    - name: aetheric-maintenance
      db: aetheric-maintenance
      passwordSecretRef:
        name: aetheric-maintenance-mongo-password
        key: password
      roles:
        - name: readWrite
          db: aetheric-maintenance
      scramCredentialsSecretName: aetheric-maintenance-scram
    - name: aetheric-membership-admin
      db: aetheric-membership
      passwordSecretRef:
        name: aetheric-membership-admin-mongo-password
        key: password
      roles:
        - name: readWrite
          db: aetheric-membership
      scramCredentialsSecretName: aetheric-membership-admin-scram
    - name: aetheric-marketing-admin
      db: aetheric-marketing
      passwordSecretRef:
        name: aetheric-marketing-admin-mongo-password
        key: password
      roles:
        - name: readWrite
          db: aetheric-marketing
      scramCredentialsSecretName: aetheric-marketing-admin-scram
    - name: aetheric-web
      db: aetheric-marketing
      passwordSecretRef:
        name: aetheric-web-mongo-password
        key: password
      roles:
        - name: read
          db: aetheric-marketing
      scramCredentialsSecretName: aetheric-web-scram
    # Used by the mongo-backup CronJob; the built-in backup role can read
    # everything for mongodump and change nothing.
    - name: mongo-backup
      db: admin
      passwordSecretRef:
        name: mongo-backup-mongo-password
        key: password
      roles:
        - name: backup
          db: admin
      scramCredentialsSecretName: mongo-backup-scram

  statefulSet:
    spec:
      volumeClaimTemplates:
      - metadata:
          name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

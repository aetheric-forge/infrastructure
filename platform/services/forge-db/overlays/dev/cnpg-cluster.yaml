apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
  namespace: aetheric-forge
spec:
  instances: 1

  storage:
    size: 10Gi

  enableSuperuserAccess: true

  superuserSecret:
    name: forge-cnpg-superuser

  serviceTemplate:
      metadata:
        annotations:
          metallb.universe.tf/address-pool: private-pool
          external-dns.alpha.kubernetes.io/hostname: forge-db-dev.int.aethericforge.ca
      spec:
        type: LoadBalancer

apiVersion: ps.percona.com/v1alpha1
kind: PerconaServerMySQL
metadata:
  name: ps-cluster1
  namespace: aetheric-forge
spec:
  crVersion: "1.1.0"

  mysql:
    clusterType: async
    size: 1

    image: percona/percona-server:8.4

    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 10Gi

  proxy:
    enabled: false

  orchestrator:
    enabled: false

  backup:
    enabled: false

  secretsName: ps-cluster1-secrets

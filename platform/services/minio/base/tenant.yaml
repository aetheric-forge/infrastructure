apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: minio
spec:
  configuration:
    name: minio-env-configuration
  externalCaCertSecret:
    name: step-ca-root-ca  
  pools:
    - name: pool-0 
      servers: 1
      volumesPerServer: 1
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 50Gi

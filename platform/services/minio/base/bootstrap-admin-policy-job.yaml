apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: minio
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 660
  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: bootstrap
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z

          env:
            - name: MINIO_CONFIG_ENV_FILE
              value: /config/config.env

          command:
            - /bin/sh
            - -ec
            - |
              . "$MINIO_CONFIG_ENV_FILE"

              ready=false
              for _ in $(seq 1 120); do
                if mc alias set minio \
                  https://minio.minio.svc.cluster.local \
                  "$MINIO_ROOT_USER" \
                  "$MINIO_ROOT_PASSWORD" \
                  --insecure
                then
                  ready=true
                  break
                fi
                echo "Waiting for MinIO..."
                sleep 5
              done

              if [ "$ready" != true ]; then
                echo "MinIO did not become ready within 600 seconds" >&2
                exit 1
              fi

              mc admin policy create \
                minio \
                minio-admins \
                /policies/minio-admins.json

          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true

            - name: policies
              mountPath: /policies
              readOnly: true

      volumes:
        - name: config
          secret:
            secretName: minio-env-configuration

        - name: policies
          configMap:
            name: minio-policies

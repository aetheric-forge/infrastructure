apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: step-ca-int-acme
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  name: minio-console
  namespace: minio
spec:
  ingressClassName: nginx
  rules:
  - host: console-dev.int.aethericforge.ca
    http:
      paths:
      - backend:
          service:
            name: minio-console
            port:
              number: 9443
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - console-dev.int.aethericforge.ca
    secretName: minio-console-tls

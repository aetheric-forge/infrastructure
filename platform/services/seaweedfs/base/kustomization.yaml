apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

# S3-compatible object storage, replacing MinIO (whose community images and
# repository are gone). All-in-one mode runs master, volume, filer and the S3
# gateway in a single pod — enough for backup targets on a small cluster.
# Needs Helm >= 3.17 for kustomize's chart rendering (the chart uses fromToml).
helmCharts:
  - name: seaweedfs
    repo: https://seaweedfs.github.io/seaweedfs/helm
    version: 4.48.0
    releaseName: seaweedfs
    namespace: seaweedfs
    valuesInline:
      master:
        enabled: false
      volume:
        enabled: false
      filer:
        enabled: false
      s3:
        enabled: false
      allInOne:
        enabled: true
        s3:
          enabled: true
          enableAuth: true
          # Identities (admin, velero, forge-db) generated by
          # scripts/bootstrap-secrets.sh from the clients' own credentials.
          existingConfigSecret: seaweedfs-s3-config
          createBuckets:
            - name: velero
            - name: forge-db
        data:
          type: persistentVolumeClaim
          size: 50Gi
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
      # Web console. `weed admin` has no SSO, only a shared password, so it
      # listens on loopback with auth off and an oauth2-proxy sidecar is the
      # only way in (Keycloak login + group check). Its config comes from the
      # overlay's seaweedfs-console ConfigMap and seaweedfs-console-oauth
      # Secret; the overlay also provides the Service/Ingress for port 4180.
      admin:
        enabled: true
        ip: 127.0.0.1
        masters: seaweedfs-all-in-one.seaweedfs:9333
        # The chart's probes dial the pod IP, which a loopback bind never
        # answers; the sidecar's /ping probe stands in for the pod.
        readinessProbe:
          enabled: false
        livenessProbe:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        sidecars:
          - name: oauth2-proxy
            image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
            args:
              - --http-address=0.0.0.0:4180
              - --upstream=http://127.0.0.1:23646
              - --provider=keycloak-oidc
              - --reverse-proxy=true
              - --email-domain=*
              - --code-challenge-method=S256
              - --skip-provider-button=true
            envFrom:
              - configMapRef:
                  name: seaweedfs-console
              - secretRef:
                  name: seaweedfs-console-oauth
            ports:
              - name: oauth2-proxy
                containerPort: 4180
            readinessProbe:
              httpGet:
                path: /ping
                port: oauth2-proxy
            livenessProbe:
              httpGet:
                path: /ping
                port: oauth2-proxy
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi

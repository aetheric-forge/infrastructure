apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - ../../secrets/prod
  - ../../base
  - ingress.yaml

patches:
  # base/kustomization.yaml's own helm values hardcode the dev tier's
  # OIDC issuer/URL (sso-dev.aethericforge.ca, argocd-dev.int.aethericforge.ca)
  # into the rendered argocd-cm ConfigMap — override both to blackcircuit.ca's
  # canonical (unsuffixed) hostnames. Patches apply to the helm chart's
  # rendered output, not the helmCharts generator directive itself.
  - target:
      version: v1
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      - op: replace
        path: /data/oidc.config
        value: |
          name: Keycloak
          issuer: https://sso.blackcircuit.ca/realms/int.blackcircuit.ca
          clientID: argocd
          clientSecret: $argocd-keycloak-oidc:clientSecret

          requestedScopes:
            - openid
            - profile
            - email
            - groups

          requestedIDTokenClaims:
            groups:
              essential: true
      - op: replace
        path: /data/url
        value: https://argocd.int.blackcircuit.ca

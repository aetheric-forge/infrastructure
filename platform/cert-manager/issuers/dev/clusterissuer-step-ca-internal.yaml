apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-int-acme
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    email: pki@blackcircuit.ca
    privateKeySecretRef:
      name: step-ca-int-acme-account-key
    server: "https://step-ca.step-ca.svc.cluster.local/acme/acme/directory"
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx-private
